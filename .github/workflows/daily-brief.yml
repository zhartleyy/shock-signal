# Save this file in your repo as: .github/workflows/daily-brief.yml

name: Daily Catalyst brief

on:
  schedule:
    - cron: "0 11 * * *"   # 11:00 UTC daily = 7am ET (summer) / 6am ET (winter)
  workflow_dispatch: {}     # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install anthropic

      - name: Generate today's brief
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate_brief.py

      - name: Commit and push
        run: |
          git config user.name "catalyst-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Daily update: $(date -u '+%B %-d, %Y')"
            git push
          fi
